<!-- ================= จบส่วนข้อมูล (ด้านล่างไม่ต้องแก้) ================= -->

<style>
/* Layout: single column "call sheet" — slate header, credits-style experience list, year-reel gallery */
:root {
  --bg: #f3f2ef;
  --surface: #ffffff;
  --fg: #16181c;
  --muted: #5d6169;
  --line: #d9d7d1;
  --accent: #c2410c;        /* tungsten / slate orange */
  --accent-soft: #fbe7dc;
  --chip: #ebe9e4;
  --font-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --surface: #1b1d21; --fg: #ecebe7; --muted: #9a9ea6;
    --line: #2c2f35; --accent: #f08a4b; --accent-soft: #3a2418; --chip: #24272c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121316; --surface: #1b1d21; --fg: #ecebe7; --muted: #9a9ea6;
  --line: #2c2f35; --accent: #f08a4b; --accent-soft: #3a2418; --chip: #24272c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  padding-inline: 20px; padding-block: 0 48px;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 960px; margin: 0 auto; }

.label {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}

/* ---------- Hero ---------- */
.hero {
  display: grid; grid-template-columns: 200px 1fr; gap: 40px; align-items: center;
  padding-block: 72px 56px; border-bottom: 1px solid var(--line);
}
.photo {
  width: 200px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px;
  background: var(--chip);
}
.hero-text { min-width: 0; display: grid; gap: 14px; }
.hero h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(36px, 6vw, 64px); line-height: 1.02; letter-spacing: -.01em;
  text-wrap: balance;
}
.hero .thai { font-size: 18px; color: var(--muted); margin: 0; }
.slate {
  display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 13px;
  color: var(--muted);
}
.slate b { color: var(--accent); font-weight: 500; }
.contacts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; padding: 0; list-style: none; }
.contacts a {
  display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none;
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); font-size: 14px; transition: border-color .15s;
}
.contacts a:hover { border-color: var(--accent); }
.contacts a span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

/* ---------- Section heads ---------- */
section { padding-block: 56px 8px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.sec-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 28px; text-wrap: balance; }

/* ---------- Experience (credits list) ---------- */
.jobs { display: grid; gap: 0; }
.job {
  display: grid; grid-template-columns: 56px 1fr; gap: 20px;
  padding-block: 28px; border-top: 1px solid var(--line);
}
.job:first-child { border-top: 0; padding-top: 0; }
.mark {
  width: 56px; height: 56px; border-radius: 8px; background: var(--chip);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted);
}
.mark img { width: 100%; height: 100%; object-fit: contain; }
.job-body { min-width: 0; display: grid; gap: 6px; }
.job-top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.role {
  font-family: var(--font-display); font-weight: 600; font-size: 20px;
  background: var(--accent-soft); color: var(--fg); padding: 0 6px; border-radius: 3px;
}
.company { font-weight: 600; }
.period { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.selected { font-size: 14px; color: var(--muted); font-style: italic; }
.job p { margin: 4px 0 0; max-width: 68ch; color: var(--fg); }
.jump {
  justify-self: start; margin-top: 8px; font-family: var(--font-mono); font-size: 13px;
  color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor;
}

/* ---------- Gallery ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button {
  font: 500 13px var(--font-mono); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.year { margin-top: 40px; }
.year:first-of-type { margin-top: 0; }
.year-head {
  display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.year-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 18px; }
.card { text-decoration: none; display: grid; gap: 8px; min-width: 0; }
.thumb {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: var(--chip);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.thumb::after {
  content: "▶"; position: absolute; inset: auto 10px 10px auto; width: 32px; height: 32px;
  display: grid; place-items: center; border-radius: 50%; font-size: 12px;
  background: rgba(0,0,0,.6); color: #fff; opacity: 0; transition: opacity .2s;
}
.card:hover .thumb img { transform: scale(1.04); }
.card:hover .thumb::after, .card:focus-visible .thumb::after { opacity: 1; }
.card-title { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25; }
.card-thai { font-size: 14px; color: var(--muted); line-height: 1.3; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 3px; background: var(--chip); color: var(--muted); }
.tag.hot { background: var(--accent-soft); color: var(--accent); }

footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
footer a { text-decoration: none; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; gap: 24px; padding-block: 40px 40px; }
  .photo { width: 140px; }
  .job { grid-template-columns: 1fr; gap: 12px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .card-title { font-size: 15px; }
}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header class="hero">
    <img class="photo" id="photo" alt="">
    <div class="hero-text">
      <div class="slate" id="slate"></div>
      <h1 id="name"></h1>
      <p class="thai" id="nameThai"></p>
      <ul class="contacts" id="contacts"></ul>
    </div>
  </header>

  <section aria-labelledby="exp-h">
    <div class="sec-head"><h2 id="exp-h">Experience</h2><span class="label" id="exp-count"></span></div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section id="projects" aria-labelledby="proj-h">
    <div class="sec-head">
      <div><span class="label" id="proj-count"></span><h2 id="proj-h"></h2></div>
      <div class="filters" id="filters" role="group" aria-label="Filter by year"></div>
    </div>
    <div id="gallery"></div>
  </section>

  <footer>
    <span class="label" id="foot-name"></span>
    <a class="label" href="#home">Back to top ↑</a>
  </footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ดึง ID วิดีโอจากลิงก์ YouTube ได้ทุกรูปแบบ (youtu.be / watch?v= / shorts)
  function ytId(url) {
    const m = String(url || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  const initials = (name) => name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();

  // Hero
  document.title = SITE.name.split(" ")[0] + " " + SITE.name.split(" ")[1] + " Portfolio";
  $("photo").src = SITE.photo; $("photo").alt = SITE.name;
  $("name").textContent = SITE.name;
  $("nameThai").textContent = SITE.nameThai;
  const current = SITE.jobs[0];
  $("slate").innerHTML =
    `<span><b>●</b> ${esc(current.role)} · ${esc(current.company)}</span><span>${esc(SITE.location)}</span>`;
  $("contacts").innerHTML = SITE.contacts.map(c =>
    `<li><a href="${esc(c.href)}" target="_blank" rel="noopener"><span>${esc(c.label)}</span>${esc(c.value)}</a></li>`).join("");
  $("foot-name").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

  // Experience
  $("exp-count").textContent = SITE.jobs.length + " roles";
  $("jobs").innerHTML = SITE.jobs.map(j => `
    <article class="job">
      <div class="mark" aria-hidden="true">${j.logo ? `<img src="${esc(j.logo)}" alt="">` : esc(initials(j.company))}</div>
      <div class="job-body">
        <div class="job-top"><span class="role">${esc(j.role)}</span><span class="company">${esc(j.company)}</span></div>
        <span class="period">${esc(j.period)}</span>
        ${j.projects ? `<span class="selected">Selected Projects: ${esc(j.projects)}</span>` : ""}
        <p>${esc(j.text)}</p>
        ${j.showProjects ? `<a class="jump" href="#projects">View ${SITE.projects.length} selected projects ↓</a>` : ""}
      </div>
    </article>`).join("");

  // Gallery
  $("proj-h").textContent = SITE.projectsTitle;
  const years = [...new Set(SITE.projects.map(p => p.year))].sort((a, b) => b - a);
  $("proj-count").textContent = SITE.projects.length + " titles · " + years[years.length - 1] + "–" + years[0];

  function card(p) {
    const id = ytId(p.youtube);
    const img = p.poster || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : "");
    const tags = String(p.tags || "").split("|").map(t => t.trim()).filter(Boolean);
    return `
      <a class="card" href="${esc(p.youtube)}" target="_blank" rel="noopener">
        <div class="thumb">${img ? `<img src="${esc(img)}" alt="${esc(p.title)} trailer" loading="lazy">` : ""}</div>
        <div><div class="card-title">${esc(p.title)}</div><div class="card-thai">${esc(p.thai)}</div></div>
        <div class="tags">${tags.map(t => `<span class="tag${/imax|original|cinema/i.test(t) ? " hot" : ""}">${esc(t)}</span>`).join("")}</div>
      </a>`;
  }

  $("gallery").innerHTML = years.map(y => {
    const items = SITE.projects.filter(p => p.year === y);
    return `<div class="year" data-year="${y}">
      <div class="year-head"><h3>${y}</h3><span class="label">${items.length} ${items.length === 1 ? "title" : "titles"}</span></div>
      <div class="grid">${items.map(card).join("")}</div>
    </div>`;
  }).join("");

  const filters = ["All", ...years];
  $("filters").innerHTML = filters.map((f, i) =>
    `<button type="button" id="f-${f}" data-f="${f}" aria-pressed="${i === 0}">${f}</button>`).join("");
  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    $("filters").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll(".year").forEach(el => {
      el.hidden = !(b.dataset.f === "All" || el.dataset.year === b.dataset.f);
    });
  });
})();
</script>
</body>
</html>
