<style>
/* Layout: film-diary profile — profile header with stats, then each role as a block with its own poster wall */
:root {
  --bg: #14181c;          /* night slate */
  --surface: #1c2228;
  --raised: #2c3440;
  --fg: #9aabbb;          /* blue-grey body text */
  --bright: #e2ebf3;      /* titles */
  --dim: #678;
  --green: #00c030;       /* hover / active */
  --orange: #ff8000;      /* role highlight */
  --blue: #40bcf4;        /* links */
  --font-display: "Source Serif 4", "Noto Serif Thai", Georgia, serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-inline: 20px; padding-block: 0 56px;
}
img { max-width: 100%; display: block; }
a { color: var(--blue); text-decoration: none; }
a:hover { color: var(--bright); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 980px; margin: 0 auto; }

.caps { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

/* ---------- Top bar ---------- */
.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-block: 18px; border-bottom: 1px solid var(--surface);
}
.topbar .brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--bright); }
.topbar nav { display: flex; gap: 18px; }
.topbar nav a { color: var(--fg); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.topbar nav a:hover { color: var(--bright); }

/* ---------- Profile header ---------- */
.profile {
  display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
  padding-block: 40px 32px;
}
.avatar {
  width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
  background: var(--raised); box-shadow: 0 0 0 1px rgba(221,238,255,.12);
}
.who { min-width: 0; display: grid; gap: 4px; }
.who h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; color: var(--bright);
  font-size: clamp(28px, 4.6vw, 42px); line-height: 1.1; text-wrap: balance;
}
.who .thai { margin: 0; font-size: 16px; }
.who .meta { font-size: 13px; color: var(--dim); }
.contacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
.contacts a {
  display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 12px; border-radius: 4px;
  background: var(--raised); color: var(--bright); font-size: 13px; transition: background .15s;
}
.contacts a span { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fg); }
.contacts a:hover { background: #3c4757; }

.stats { display: flex; gap: 0; }
.stat { text-align: center; padding-inline: 16px; border-left: 1px solid var(--raised); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--bright); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* ---------- Section rule (Letterboxd-style) ---------- */
.rule {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  border-bottom: 1px solid var(--raised); padding-bottom: 6px; margin-bottom: 4px;
}
.rule h2, .rule h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--fg); }

/* ---------- Jobs ---------- */
.jobs { display: grid; gap: 0; margin-top: 8px; }
.job { padding-block: 28px; border-bottom: 1px solid var(--surface); display: grid; gap: 18px; }
.job-head { display: grid; grid-template-columns: 96px 1fr; gap: 20px; }
.mark {
  width: 96px; height: 56px; border-radius: 4px; background: var(--raised);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--bright);
}
.mark:has(img) { background: transparent; place-items: start; }
.mark img { width: 100%; height: 56px; object-fit: contain; object-position: left top; }
.job-body { min-width: 0; display: grid; gap: 4px; }
.job-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--bright); line-height: 1.25; }
.job-title .role { color: var(--orange); }
.job-title .at { color: var(--dim); font-weight: 600; font-size: 18px; }
.period { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.selected { font-size: 14px; }
.selected b { color: var(--bright); font-weight: 500; }
.job p { margin: 6px 0 0; max-width: 70ch; }
.current { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 3px; background: var(--green); color: #0b1a0f; font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; vertical-align: 4px; }

/* ---------- Poster wall ---------- */
.wall { display: grid; gap: 16px; }
.wall-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--raised); padding-bottom: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.filters button {
  font: 600 12px var(--font-body); letter-spacing: .04em; padding: 4px 10px; border-radius: 3px;
  border: 0; background: transparent; color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums;
}
.filters button:hover { color: var(--bright); }
.filters button[aria-pressed="true"] { background: var(--raised); color: var(--bright); }

.year { display: grid; gap: 12px; }
.year + .year { margin-top: 12px; }
.year-label { display: flex; align-items: baseline; gap: 10px; }
.year-label b { font-family: var(--font-display); font-size: 20px; color: var(--bright); font-variant-numeric: tabular-nums; }
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px 10px; list-style: none; margin: 0; padding: 0; }
.film { display: grid; gap: 6px; min-width: 0; color: inherit; }
.poster {
  position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 4px; overflow: hidden;
  background: var(--raised);
  box-shadow: inset 0 0 0 1px rgba(221,238,255,.18), 0 2px 6px rgba(0,0,0,.4);
  transition: box-shadow .15s;
}
.poster img { width: 100%; height: 100%; object-fit: cover; }
.poster::before { /* inner frame like a poster edge */
  content: ""; position: absolute; inset: 0; border-radius: 4px; z-index: 2;
  box-shadow: inset 0 0 0 1px rgba(221,238,255,.18); pointer-events: none;
}
.poster.auto::after { /* gradient so the title reads over a trailer frame */
  content: ""; position: absolute; inset: 40% 0 0 0; z-index: 1;
  background: linear-gradient(to bottom, rgba(20,24,28,0), rgba(20,24,28,.92));
}
.poster .over {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 2;
  font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.15; color: #fff;
  text-wrap: balance; text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
.poster .badge {
  position: absolute; top: 6px; left: 6px; z-index: 3; padding: 1px 5px; border-radius: 2px;
  font-size: 9px; font-weight: 600; letter-spacing: .1em; background: rgba(20,24,28,.85); color: var(--bright);
}
a.film:hover .poster, a.film:focus-visible .poster { box-shadow: inset 0 0 0 1px rgba(221,238,255,.18), 0 0 0 3px var(--green); }
a.film:focus-visible { outline: none; }
.film-meta { display: grid; gap: 1px; min-width: 0; }
.film-thai { font-size: 13px; color: var(--bright); line-height: 1.3; overflow-wrap: anywhere; }
.film-tags { font-size: 11px; color: var(--dim); line-height: 1.35; }

footer { margin-top: 48px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--dim); }

@media (max-width: 720px) {
  .profile { grid-template-columns: auto 1fr; }
  .stats { grid-column: 1 / -1; justify-content: flex-start; }
  .stat:first-child { padding-left: 0; }
}
@media (max-width: 480px) {
  .profile { grid-template-columns: 1fr; gap: 16px; padding-block: 28px 24px; }
  .avatar { width: 88px; height: 88px; }
  .job-head { grid-template-columns: 1fr; gap: 10px; }
  .posters { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; }
  .poster .over { font-size: 12px; left: 6px; right: 6px; bottom: 6px; }
  .topbar nav { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header class="topbar">
    <a class="brand" href="#home" id="brand"></a>
    <nav aria-label="Sections"><a href="#experience">Experience</a><a href="#films">Films</a><a href="#contact">Contact</a></nav>
  </header>

  <section class="profile" id="contact">
    <img class="avatar" id="photo" alt="" onerror="this.style.visibility='hidden'">
    <div class="who">
      <h1 id="name"></h1>
      <p class="thai" id="nameThai"></p>
      <div class="meta" id="meta"></div>
      <ul class="contacts" id="contacts"></ul>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="experience" aria-labelledby="exp-h">
    <div class="rule"><h2 id="exp-h">Experience</h2><span class="caps" id="exp-count"></span></div>
    <div class="jobs" id="jobs"></div>
  </section>

  <footer>
    <span id="foot-name"></span>
    <a href="#home">Back to top ↑</a>
  </footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ytId = (url) => (String(url || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1] || "";
  const initials = (name) => name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const splitTags = (t) => String(t || "").split("|").map(x => x.trim()).filter(Boolean);

  const allFilms = SITE.jobs.flatMap(j => j.films || []);
  const allYears = allFilms.map(f => f.year);
  const firstYear = Math.min(...SITE.jobs.map(j => +(j.period.match(/\d{4}/) || [9999])[0]));
  const yearsActive = new Date().getFullYear() - firstYear;
  const imax = allFilms.filter(f => /imax/i.test(f.tags)).length;

  // Header
  $("brand").textContent = SITE.name.split(" ").slice(0, 2).join(" ");
  $("photo").src = SITE.photo; $("photo").alt = SITE.name;
  $("name").textContent = SITE.name;
  $("nameThai").textContent = SITE.nameThai;
  $("meta").textContent = SITE.jobs[0].role + " at " + SITE.jobs[0].company + " · " + SITE.location;
  $("contacts").innerHTML = SITE.contacts.map(c =>
    `<li><a href="${esc(c.href)}" target="_blank" rel="noopener"><span>${esc(c.label)}</span>${esc(c.value)}</a></li>`).join("");
  $("stats").innerHTML = [
    [allFilms.length, "Titles"],
    [imax, "IMAX"],
    [yearsActive, "Years"],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  $("foot-name").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
  $("exp-count").textContent = SITE.jobs.length + " roles";

  function filmCard(f) {
    const id = ytId(f.youtube);
    const img = f.poster || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : "");
    const auto = !f.poster;
    const tags = splitTags(f.tags);
    const badge = tags.find(t => /imax/i.test(t));
    const rest = tags.filter(t => t !== badge).join(" · ");
    const inner = `
      <div class="poster${auto ? " auto" : ""}">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        ${badge ? `<span class="badge">IMAX</span>` : ""}
        ${auto ? `<span class="over">${esc(f.title)}</span>` : ""}
      </div>
      <div class="film-meta">
        ${auto ? "" : `<span class="film-thai">${esc(f.title)}</span>`}
        <span class="film-thai">${esc(f.thai)}</span>
        ${rest ? `<span class="film-tags">${esc(rest)}</span>` : ""}
      </div>`;
    const label = esc(f.title + (f.thai ? " (" + f.thai + ")" : "") + " — watch trailer");
    return f.youtube
      ? `<li><a class="film" href="${esc(f.youtube)}" target="_blank" rel="noopener" aria-label="${label}">${inner}</a></li>`
      : `<li><div class="film">${inner}</div></li>`;
  }

  function wall(job, idx) {
    const films = job.films || [];
    if (!films.length) return "";
    const years = [...new Set(films.map(f => f.year))].sort((a, b) => b - a);
    const filters = years.length > 1
      ? `<div class="filters" role="group" aria-label="Filter by year" data-job="${idx}">
           ${["All", ...years].map((y, i) => `<button type="button" id="f-${idx}-${y}" data-f="${y}" aria-pressed="${i === 0}">${y}</button>`).join("")}
         </div>` : "";
    return `
      <div class="wall" id="${idx === firstWall ? "films" : "films-" + idx}">
        <div class="wall-bar"><span class="caps">Selected projects · ${films.length} titles</span>${filters}</div>
        ${years.map(y => {
          const list = films.filter(f => f.year === y);
          return `<div class="year" data-job="${idx}" data-year="${y}">
            <div class="year-label"><b>${y}</b><span class="caps">${list.length} ${list.length === 1 ? "title" : "titles"}</span></div>
            <ul class="posters">${list.map(filmCard).join("")}</ul>
          </div>`;
        }).join("")}
      </div>`;
  }

  const firstWall = SITE.jobs.findIndex(j => (j.films || []).length);

  $("jobs").innerHTML = SITE.jobs.map((j, i) => `
    <article class="job">
      <div class="job-head">
        <div class="mark" aria-hidden="true">${j.logo ? `<img src="${esc(j.logo)}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(initials(j.company))}'))">` : esc(initials(j.company))}</div>
        <div class="job-body">
          <h3 class="job-title"><span class="role">${esc(j.role)}</span> <span class="at">at</span> ${esc(j.company)}${i === 0 && /present/i.test(j.period) ? `<span class="current">Now</span>` : ""}</h3>
          <span class="period">${esc(j.period)}</span>
          ${j.projects ? `<span class="selected">Selected projects: <b>${esc(j.projects)}</b></span>` : ""}
          <p>${esc(j.text)}</p>
        </div>
      </div>
      ${wall(j, i)}
    </article>`).join("");

  document.querySelectorAll(".filters").forEach(group => {
    group.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      group.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      document.querySelectorAll(`.year[data-job="${group.dataset.job}"]`).forEach(el => {
        el.hidden = !(b.dataset.f === "All" || el.dataset.year === b.dataset.f);
      });
    });
  });
})();
</script>
</body>
</html>
